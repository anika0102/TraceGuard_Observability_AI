apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: traceguard
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.64.0
          env:
            - { name: MEMORY_MAX_TRACES, value: "5000" }   # in-memory storage: traces vanish on restart
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: admin, containerPort: 14269 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: admin }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: traceguard
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
