# OpenTelemetry Collector pipeline:  app --OTLP/gRPC--> collector --OTLP/gRPC--> Jaeger
# Used unchanged by docker-compose and by the Kubernetes deployment (service names match).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true   # plaintext inside the local compose/cluster network only
  debug:
    verbosity: basic   # prints span counts to the collector log; useful for "is anything arriving?"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
