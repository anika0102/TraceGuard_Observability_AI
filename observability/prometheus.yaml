global:
  scrape_interval: 5s       # short on purpose so the demo reacts quickly
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: traceguard
    metrics_path: /metrics
    static_configs:
      - targets: ["traceguard:8000"]   # compose service name == Kubernetes Service name
